    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Odyssey WebGPU Pilot</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        body { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
        #hud {
            position: fixed; top: 10px; left: 12px; z-index: 10;

            color: #ff9a9a; font-size: 12px; line-height: 1.4; white-space: pre-wrap;
            max-height: 38%; overflow: auto; text-shadow: 0 0 4px #000;
        }
    </style>
</head>

    <div id="hud">booting…</div>
    <div id="err"></div>
