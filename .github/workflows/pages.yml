name: Build and Deploy Pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # Supply-chain (Phase 0.5): never run install scripts in CI. esbuild/rollup
      # ship platform binaries as optional deps; electron's postinstall download
      # is not needed for typecheck/lint/test.
      - run: npm ci --ignore-scripts
      # Type-checking is a HARD gate. It is opt-in (checkJs:false; only files with
      # `// @ts-check` plus the shared *.d.ts contracts are checked), so it is green
      # today and stays green as modules are annotated. See tsconfig.json.
      - run: npm run typecheck
      # TS coverage ratchet (Phase 3a): a file that carries // @ts-check may
      # never silently lose it — the opt-in typecheck only ratchets forward.
      - run: node scripts/ts-ratchet-check.mjs
      # Lint is a HARD gate via the error-count ratchet (Phase 0.3, ADR-0002):
      # fails when errors exceed the committed lint-ratchet.json baseline, so the
      # count can only shrink. Replace with a plain `npm run lint` once it hits 0.
      - run: npm run lint:ci
      # Architecture fitness ratchets (Phase 3d): god-file line ceilings,
      # ShaderMaterial count, core nondeterminism/DOM-global/rAF counts,
      # resize-listener sprawl — shrink-only, baselines in
      # architecture-fitness.json.
      - run: node scripts/architecture-fitness-check.mjs
      # Theme lifecycle contract (SB-04, remediated 2026-07-17): stop()/cleanup()
      # overrides must chain to super, listeners must not use inline bind(this),
      # raw window resize listeners need a removal path. Heuristics are
      # unit-tested in tests/unit/theme-lifecycle-audit.test.js.
      - run: npm run audit:theme-lifecycle
      # Import-boundary rules (Phase 3d layer 1): core-stays-headless,
      # themes-are-islands, no-electron-in-renderer, with a shrink-only
      # known-violations baseline in .dependency-cruiser.cjs.
      - run: npm run check:boundaries
      - run: npm test
      # Release-gate scaffolding (Phase 0.4): dev mode — asserts the observability
      # scaffolding exists and warns (not fails) on the placeholder Steam AppID.
      # SERENITY_RELEASE=1 (packaging path only) turns the AppID check hard.
      - run: npm run check:release-gates
      # Supply-chain (Phase 0.5): the shipped dependency surface must be clean —
      # hard gate. Full-tree audit is a visible warning lane (known breaking-bump
      # advisories: electron, esbuild-via-vite).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:pages-artifact
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
