name: Odyssey GPU Validation

# Remediation plan Phase 3c — the GLSL→TSL/WebGPU regression gate, run OFF the
# dev machine so a WGSL/TSL graph error fails CI without touching the dev iGPU.
#
# ONE leg in CI: WebGL2 (ODYSSEY_FORCE_WEBGL=1). The WebGPURenderer's WebGL2
# backend compiles the SAME TSL graphs and catches WGSL/pipeline graph errors.
# The real-WebGPU leg is deliberately NOT run here (plan §3c abort criterion):
# on driverless CI, WebGPU-on-SwiftShader never initializes cleanly — it loops
# on shared-memory failures and produces no usable signal (verified over two
# runs) — so it stays a documented local pre-release step
# (`npm run validate:odyssey:webgpu`). A runner with a real WebGPU adapter can
# re-add the leg unchanged.
#
# Software rasterization is slow (10–100×), so per-PR runs a representative
# 3-scene subset; the full 11-scene sweep runs nightly + on demand.
#
# Not part of pages.yml (the deploy pipeline) — a slow GPU leg must never block a
# docs/site deploy. Path-filtered to odyssey/pilot/script changes.

on:
  pull_request:
    paths:
      - 'src/rendering/odyssey/**'
      - 'odyssey-webgpu-pilot.html'
      - 'scripts/odyssey-webgpu-validation.mjs'
      - 'scripts/run-electron.mjs'
      - '.github/workflows/gpu-validation.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # nightly ~06:00 UTC

permissions:
  contents: read

concurrency:
  group: gpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  odyssey-gpu:
    # Pinned to 22.04: stable, well-known Electron runtime deps (24.04 renamed
    # several to the -t64 ABI, which churns the apt list).
    runs-on: ubuntu-22.04
    # Nightly full 11-scene sweep is ~21 min under SwiftShader; give headroom.
    # Per-PR subset finishes well under. Per-scene 90s readiness bound caps hangs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Supply-chain posture (Phase 0.5): no arbitrary package install scripts.
      - run: npm ci --ignore-scripts
      # ...but this job needs Electron's OWN binary — fetch only that via
      # Electron's downloader (not other packages' postinstalls).
      - name: Fetch Electron binary
        run: node node_modules/electron/install.js

      # Electron runtime deps + a virtual display for the headless GPU boot.
      - name: Install xvfb + Electron runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2

      # Explicit Xvfb + DISPLAY rather than `xvfb-run`: xvfb-run does NOT reliably
      # propagate the wrapped command's exit code, which turns a failed gate into a
      # false green (observed on run #1: the WebGL2 gate reported 0/11 yet the job
      # passed). A backgrounded Xvfb + a direct `node` run under `bash -e` surfaces
      # the real exit code.
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3

      # HARD GATE — a WGSL/TSL graph error in any validated chapter fails here.
      # Per-PR: a fast representative subset (a heavy chapter + the once-exempt
      # chapter 3 + a non-chapter renderer). Nightly / dispatch: the full
      # 11-scene sweep (empty filter = all). Each scene is bounded by the
      # harness's 90s readiness timeout, so a hung scene fails, not stalls.
      - name: Validate — WebGL2 backend (gate)
        run: node scripts/run-electron.mjs scripts/odyssey-webgpu-validation.mjs
        env:
          ODYSSEY_FORCE_WEBGL: '1'
          ODYSSEY_VALIDATION_SCENES: ${{ github.event_name == 'pull_request' && 'deep-ocean,surface-world,path' || '' }}

      - name: Upload validation artifacts (screenshots + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-gpu-validation
          path: artifacts/odyssey/webgpu-validation/
          if-no-files-found: warn
