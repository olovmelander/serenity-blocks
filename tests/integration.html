<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity Blocks - Modular Integration Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #test-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #fbbf24;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 4px solid #fbbf24;
        }

        .test-section h2 {
            color: #fbbf24;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .test-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
        }

        .test-status {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .test-status.loading {
            background: #fbbf24;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .test-status.success {
            background: #10b981;
        }

        .test-status.error {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .test-name {
            flex: 1;
        }

        .test-details {
            font-size: 12px;
            color: #9ca3af;
            margin-left: 36px;
            margin-top: 4px;
        }

        #start-game-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #start-game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.4);
        }

        #start-game-btn:active {
            transform: translateY(0);
        }

        #start-game-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="test-container">
        <h1>🎮 Serenity Blocks</h1>
        <p class="subtitle">Modular Architecture Integration Test</p>

        <div class="test-section">
            <h2>Core Systems</h2>
            <div id="test-core"></div>
        </div>

        <div class="test-section">
            <h2>Managers</h2>
            <div id="test-managers"></div>
        </div>

        <div class="test-section">
            <h2>Theme System</h2>
            <div id="test-themes"></div>
        </div>

        <div class="test-section">
            <h2>Integration</h2>
            <div id="test-integration"></div>
        </div>

        <button id="start-game-btn" disabled>Initializing...</button>
        <div id="error-container"></div>
    </div>

    <script type="module">
        // Test utilities
        function addTest(containerId, name, status = 'loading', details = '') {
            const container = document.getElementById(containerId);
            const testItem = document.createElement('div');
            testItem.className = 'test-item';
            testItem.innerHTML = `
                <div class="test-status ${status}">
                    ${status === 'success' ? '✓' : status === 'error' ? '✗' : '●'}
                </div>
                <div class="test-name">${name}</div>
            `;
            if (details) {
                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'test-details';
                detailsDiv.textContent = details;
                testItem.appendChild(detailsDiv);
            }
            container.appendChild(testItem);
            return testItem;
        }

        function updateTest(testItem, status, details = '') {
            const statusEl = testItem.querySelector('.test-status');
            statusEl.className = `test-status ${status}`;
            statusEl.textContent = status === 'success' ? '✓' : status === 'error' ? '✗' : '●';

            if (details) {
                let detailsEl = testItem.querySelector('.test-details');
                if (!detailsEl) {
                    detailsEl = document.createElement('div');
                    detailsEl.className = 'test-details';
                    testItem.appendChild(detailsEl);
                }
                detailsEl.textContent = details;
            }
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
        }

        // Run integration tests
        async function runTests() {
            console.log('🧪 Starting integration tests...');

            // Test 1: Core module imports
            const coreTest = addTest('test-core', 'Core modules import');
            try {
                const { COLS, ROWS, THEMES } = await import('../src/core/constants.js');
                const { GameState } = await import('../src/core/game.js');
                updateTest(coreTest, 'success', `${THEMES.length} themes available`);
            } catch (error) {
                updateTest(coreTest, 'error', error.message);
                throw error;
            }

            // Test 2: Rendering modules
            const renderTest = addTest('test-core', 'Rendering modules import');
            try {
                const { WebGLRenderer } = await import('../src/rendering/renderer.js');
                const { draw } = await import('../src/rendering/draw.js');
                updateTest(renderTest, 'success');
            } catch (error) {
                updateTest(renderTest, 'error', error.message);
                throw error;
            }

            // Test 3: Manager imports
            const managerTest = addTest('test-managers', 'Manager modules import');
            try {
                const { SettingsManager } = await import('../src/ui/settings.js');
                const { HighScoreManager } = await import('../src/ui/high-scores.js');
                const { SoundManager } = await import('../src/audio/sound-manager.js');
                updateTest(managerTest, 'success');
            } catch (error) {
                updateTest(managerTest, 'error', error.message);
                throw error;
            }

            // Test 4: Theme system
            const themeSystemTest = addTest('test-themes', 'Theme system import');
            try {
                const { BaseTheme } = await import('../src/themes/base-theme.js');
                const { ThemeManager } = await import('../src/themes/theme-manager.js');
                updateTest(themeSystemTest, 'success');
            } catch (error) {
                updateTest(themeSystemTest, 'error', error.message);
                throw error;
            }

            // Test 5: Load a sample theme
            const themeLoadTest = addTest('test-themes', 'Load forest theme');
            try {
                const ForestTheme = await import('../src/themes/forest/forest-theme.js');
                const theme = new ForestTheme.default();
                updateTest(themeLoadTest, 'success', `Theme name: ${theme.name}`);
            } catch (error) {
                updateTest(themeLoadTest, 'error', error.message);
                console.error('Theme load error:', error);
            }

            // Test 6: Main application
            const mainTest = addTest('test-integration', 'Main application import');
            try {
                const { SerenityBlocks } = await import('../src/main.js');
                updateTest(mainTest, 'success');
            } catch (error) {
                updateTest(mainTest, 'error', error.message);
                throw error;
            }

            // Test 7: Full initialization
            const initTest = addTest('test-integration', 'Initialize application');
            try {
                // The application should auto-initialize via bootstrap
                // Wait a bit for it to complete
                await new Promise(resolve => setTimeout(resolve, 1000));

                if (window.serenityBlocks && window.serenityBlocks.isInitialized) {
                    updateTest(initTest, 'success', 'Application ready');
                    document.getElementById('start-game-btn').disabled = false;
                    document.getElementById('start-game-btn').textContent = 'All Tests Passed! ✓';
                } else {
                    throw new Error('Application not initialized');
                }
            } catch (error) {
                updateTest(initTest, 'error', error.message);
                showError('Application failed to initialize. Check browser console for details.');
            }

            console.log('✅ Integration tests complete');
        }

        // Start tests when page loads
        runTests().catch(error => {
            console.error('❌ Integration tests failed:', error);
            showError(`Tests failed: ${error.message}`);
        });

        // Button click handler
        document.getElementById('start-game-btn').addEventListener('click', () => {
            window.location.href = '../public/index.html';
        });
    </script>

    <!-- Include main.js to actually initialize the app -->
    <script type="module" src="../src/main.js"></script>
</body>
</html>
