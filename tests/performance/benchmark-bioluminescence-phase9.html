<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioluminescence Baseline Harness</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #0ff; font-family: monospace; }
        #container { position: absolute; inset: 0; }
        #stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; pointer-events: none; z-index: 999; }
        #controls { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; }
        button { background: #004444; color: #0ff; border: 1px solid #0ff; padding: 6px 10px; cursor: pointer; }
        button:hover { background: #006666; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="stats">Initializing...</div>
    <div id="controls">
        <button id="btn-start">Start Scripted Run</button>
        <button id="btn-capture">Capture</button>
        <button id="btn-evidence">Collect Evidence</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../../node_modules/three/build/three.module.js",
                "three/addons/": "../../node_modules/three/examples/jsm/",
                "three/webgpu": "../../node_modules/three/build/three.webgpu.js",
                "three/tsl": "../../node_modules/three/build/three.tsl.js"
            }
        }
    </script>

    <script type="module">
        import { Game } from '../../src/game.js';
        import { eventBus, EVENTS } from '../../src/events/event-bus.js';

        const urlParams = new URLSearchParams(window.location.search);
        const forceWebGL = urlParams.get('forceWebGL') === '1';
        const quality = urlParams.get('quality') || 'High';
        const seed = urlParams.get('bioluminescenceSeed') || 'benchmark_seed_2026';
        const fixedDt = Number.parseFloat(urlParams.get('bioluminescenceFixedDt')) || 16.666;

        let game = null;
        let benchmarkActive = false;
        let startTime = 0;
        let eventScheduleIndex = 0;

        const eventSchedule = [
            { time: 2000, type: 'piece_lock' },
            { time: 5000, type: 'log_stats', label: 'Shot A / Idle' },
            { time: 10000, type: 'line_clear', lines: 1 },
            { time: 12000, type: 'line_clear', lines: 4 },
            { time: 15000, type: 'combo', count: 2 },
            { time: 16000, type: 'combo', count: 4 },
            { time: 17000, type: 'combo', count: 6 },
            { time: 20000, type: 'log_stats', label: 'Shot C / Combo Stress' },
            { time: 23000, type: 'end' },
        ];

        function helper() {
            return window.bioluminescenceBaseline || null;
        }

        function formatStats(report) {
            const fps = Number.isFinite(report?.fps) ? report.fps.toFixed(1) : '0.0';
            const drawCalls = report?.drawCalls ?? report?.metrics?.drawCalls ?? 0;
            const backend = report?.backend || (forceWebGL ? 'WebGL' : 'WebGPU');
            return `FPS: ${fps} | DrawCalls: ${drawCalls} | Mode: ${backend} | Quality: ${quality}`;
        }

        function emitScheduledEvent(event) {
            switch (event.type) {
            case 'piece_lock':
                eventBus.emit(EVENTS.PIECE_LOCK, { source: 'benchmark' });
                break;
            case 'line_clear':
                eventBus.emit(EVENTS.LINE_CLEAR, { lines: event.lines, comboCount: 0 });
                break;
            case 'combo':
                eventBus.emit(EVENTS.COMBO, { comboCount: event.count });
                break;
            case 'log_stats': {
                const report = helper()?.report?.();
                console.log(`[Bioluminescence Benchmark] ${event.label}`, report);
                break;
            }
            case 'end':
                benchmarkActive = false;
                console.log('[Bioluminescence Benchmark] Scripted run completed.');
                break;
            default:
                break;
            }
        }

        function processSchedule(elapsedMs) {
            while (eventScheduleIndex < eventSchedule.length) {
                const next = eventSchedule[eventScheduleIndex];
                if (elapsedMs < next.time) break;
                emitScheduledEvent(next);
                eventScheduleIndex += 1;
            }
        }

        function updateStats() {
            const baseline = helper();
            if (!baseline?.report) return;
            const report = baseline.report();
            document.getElementById('stats').innerText = formatStats(report);
        }

        function frame(timestamp) {
            requestAnimationFrame(frame);
            if (benchmarkActive) {
                processSchedule(timestamp - startTime);
            }
            updateStats();
        }

        async function init() {
            const container = document.getElementById('container');
            game = new Game({
                container,
                rendererType: forceWebGL ? 'webgl' : 'webgpu',
                quality,
            });

            if (typeof game.init === 'function') await game.init();
            if (game.themeSystem) {
                await game.themeSystem.loadTheme('bioluminescence');
            }

            const baseline = helper();
            baseline?.setDeterministicSeed?.(seed);
            baseline?.setFixedTimestep?.(fixedDt);

            document.getElementById('stats').innerText = `Ready. Mode: ${forceWebGL ? 'WebGL' : 'WebGPU'} | Quality: ${quality}`;
            requestAnimationFrame(frame);
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            startTime = performance.now();
            benchmarkActive = true;
            eventScheduleIndex = 0;
            console.log('[Bioluminescence Benchmark] Scripted run started.');
        });

        document.getElementById('btn-capture').addEventListener('click', () => {
            const data = helper()?.capture?.();
            if (typeof data === 'string' && data.length > 0) {
                console.log('[Bioluminescence Benchmark] Capture size:', data.length);
            } else {
                console.warn('[Bioluminescence Benchmark] Capture unavailable.');
            }
        });

        document.getElementById('btn-evidence').addEventListener('click', async () => {
            const baseline = helper();
            if (!baseline?.collectEvidence) {
                console.warn('[Bioluminescence Benchmark] collectEvidence helper unavailable.');
                return;
            }
            const evidence = await baseline.collectEvidence({
                includeAnchors: true,
                includePresetSweep: true,
                includeSoak: false,
            });
            console.log('[Bioluminescence Benchmark] Evidence:', evidence);
        });

        window.bioluminescenceHarness = {
            runWebGPUCampaign: () => window.location.assign('?theme=bioluminescence&quality=High&bioluminescenceSeed=BASELINE_2026&bioluminescenceFixedDt=16.666'),
            runWebGLCampaign: () => window.location.assign('?theme=bioluminescence&quality=High&bioluminescenceSeed=BASELINE_2026&bioluminescenceFixedDt=16.666&forceWebGL=1'),
            getReport: () => helper()?.report?.(),
        };

        init();
    </script>
</body>
</html>
