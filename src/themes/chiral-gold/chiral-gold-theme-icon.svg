    <circle cx="217" cy="118" r="1.1" fill="#d6a43a"/>
    <circle cx="33" cy="152" r="1.3" fill="#e0b753"/>
    <circle cx="65" cy="214" r="1.5" fill="#f7de9a"/>
    <circle cx="201" cy="208" r="1.4" fill="#edc967"/>
    <circle cx="170" cy="234" r="1.2" fill="#d9ab3f"/>
  </g>

  <g stroke="url(#gold)" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M96 24 C120 56, 118 96, 92 128 C66 160, 66 200, 92 232" stroke-width="4.5"/>
