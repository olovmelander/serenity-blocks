  <rect x="42" y="30" width="12" height="12" fill="white" opacity="0.9" rx="2"/>
  <rect x="54" y="30" width="12" height="12" fill="white" opacity="0.9" rx="2"/>
  
  <rect x="30" y="44" width="12" height="12" fill="white" opacity="0.8" rx="2"/>
  <rect x="42" y="44" width="12" height="12" fill="white" opacity="0.8" rx="2"/>
  
  <rect x="42" y="58" width="12" height="12" fill="white" opacity="0.7" rx="2"/>
  <rect x="54" y="58" width="12" height="12" fill="white" opacity="0.7" rx="2"/>
</svg>

