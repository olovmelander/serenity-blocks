<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Serenity mark: one continuous S-shaped wave. No squares, pieces, grid,
       stack, or falling motion — an independent brand mark, legible at 16x16. -->
  <defs>
    <linearGradient id="serenity-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64c8ff"/>
      <stop offset="1" stop-color="#c864ff"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="45" fill="url(#serenity-gradient)"/>

  <path
    d="M69 31
       C61 23 41 22 33 33
       C26 43 37 48 52 51
       C67 54 73 61 66 70
       C58 81 38 80 29 69"
    fill="none"
    stroke="white"
    stroke-width="10"
    stroke-linecap="round"
  />
</svg>
