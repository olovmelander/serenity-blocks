<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=public/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Serenity Blocks...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            color: #ffffff;
        }
        .redirect-message {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .redirect-message h1 {
            margin-bottom: 20px;
            font-size: 2em;
        }
        .redirect-message p {
            margin-bottom: 20px;
            opacity: 0.8;
        }
        .redirect-message a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>Serenity Blocks</h1>
        <p>Redirecting to the game...</p>
        <p>If you are not redirected automatically, <a href="public/index.html">click here</a>.</p>
    </div>
    <script>
        // Immediate redirect for browsers that don't support meta refresh
        window.location.href = 'public/index.html';
    </script>
</body>
</html>
